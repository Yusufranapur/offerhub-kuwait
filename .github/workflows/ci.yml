name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 7.0.x
    - name: Restore dependencies
      run: dotnet restore backend/OfferHub.sln
    - name: Build
      run: dotnet build backend/OfferHub.sln -c Release --no-restore
    - name: Test
      run: dotnet test backend/OfferHub.sln -c Release --no-build --verbosity normal

  build-vendor-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: 'vendor-portal/package-lock.json'
    - run: npm ci
      working-directory: ./vendor-portal
    - run: npm run build
      working-directory: ./vendor-portal
    - run: npm test --if-present
      working-directory: ./vendor-portal

  build-admin-portal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: 'admin-portal/package-lock.json'
    - run: npm ci
      working-directory: ./admin-portal
    - run: npm run build
      working-directory: ./admin-portal
    - run: npm test --if-present
      working-directory: ./admin-portal
