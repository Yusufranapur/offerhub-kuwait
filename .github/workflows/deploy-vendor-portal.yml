name: Deploy Vendor Portal to S3 & CloudFront

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vendor-portal/**'
      - '.github/workflows/deploy-vendor-portal.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: 'vendor-portal/package-lock.json'

    - name: Install dependencies
      working-directory: ./vendor-portal
      run: npm ci

    - name: Build project
      working-directory: ./vendor-portal
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: me-south-1

    - name: Deploy to S3
      working-directory: ./vendor-portal/dist
      run: aws s3 sync . s3://${{ secrets.VENDOR_PORTAL_S3_BUCKET }} --delete

    - name: Invalidate CloudFront
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.VENDOR_PORTAL_CLOUDFRONT_DIST_ID }} --paths "/*"
